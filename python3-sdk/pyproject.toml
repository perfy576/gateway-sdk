[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gateway-sdk"
version = "1.2.0"
description = "Versioned Gateway token and cookie verifier"
requires-python = ">=3.9"
dependencies = ["PyJWT>=2.10.1,<3"]

[tool.setuptools.packages.find]
where = ["src"]
